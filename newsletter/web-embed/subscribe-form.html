<!--
  Newsletter 订阅组件 — 嵌入 fengyuwang.com

  使用方法:
  1. 将此 HTML 插入个人网站任意位置
  2. form action 指向 subscribe@fengyuwang.com (mailto fallback)
  3. 或: 用 Cloudflare Worker 作为代理 (见 worker.js)

  样式适配你的网站主题，可调整颜色变量。
-->
<style>
  .nl-signup {
    --nl-bg: #f5f5f5;
    --nl-text: #333;
    --nl-border: #ddd;
    --nl-accent: #2563eb;
    --nl-radius: 8px;
  }
  .nl-signup {
    background: var(--nl-bg);
    border: 1px solid var(--nl-border);
    border-radius: var(--nl-radius);
    padding: 2rem;
    margin: 2rem 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .nl-signup h3 {
    margin: 0 0 0.5rem;
    font-size: 1.25rem;
    color: var(--nl-text);
  }
  .nl-signup p {
    margin: 0 0 1rem;
    color: #666;
    font-size: 0.9rem;
    line-height: 1.5;
  }
  .nl-signup form {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }
  .nl-signup input[type="email"] {
    flex: 1;
    min-width: 200px;
    padding: 0.6rem 0.8rem;
    border: 1px solid var(--nl-border);
    border-radius: var(--nl-radius);
    font-size: 0.95rem;
  }
  .nl-signup button {
    padding: 0.6rem 1.2rem;
    background: var(--nl-accent);
    color: #fff;
    border: none;
    border-radius: var(--nl-radius);
    font-size: 0.95rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .nl-signup button:hover {
    opacity: 0.9;
  }
  .nl-signup .note {
    margin-top: 0.6rem;
    font-size: 0.8rem;
    color: #999;
  }
</style>

<div class="nl-signup">
  <h3>📬 每月项目更新</h3>
  <p>每月的项目进展、技术思考、行业观察。不营销，不废话。</p>
  <form action="mailto:subscribe@fengyuwang.com" method="get" enctype="text/plain"
        onsubmit="return confirm('你的邮箱客户端会打开一封新邮件，发送即订阅。')">
    <input type="email" name="body" placeholder="你的邮箱" required>
    <button type="submit">订阅</button>
  </form>
  <div class="note">
    发一封邮件即订阅，回复任意邮件即退订。你的地址不会被分享。
  </div>
</div>
